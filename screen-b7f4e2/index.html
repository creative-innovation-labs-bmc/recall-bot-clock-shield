<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; media-src 'self'; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Screen</title>
  <link rel="preload" href="fonts/OpenSans-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/OpenSans-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/PTSerif-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css?v=20260806-1">
</head>
<body>
  <div id="viewport">
    <div id="stage-shell">
      <main id="stage" aria-label="Recall-Bot three-panel clock prototype">
        <section class="panel" data-kind="hour">
          <video id="hour-video" class="panel-video" muted autoplay loop playsinline preload="auto"></video>
          <div class="shade" aria-hidden="true"></div>
          <header class="panel-header">
            <div class="panel-date">THU 06 AUG</div>
            <div class="panel-label">HOUR</div>
          </header>
          <div class="panel-value" id="hour-value">00</div>
          <footer class="panel-footer"><time class="mini-clock">00:00:00</time></footer>
        </section>

        <section class="panel" data-kind="minute">
          <video id="minute-video" class="panel-video" muted autoplay loop playsinline preload="auto"></video>
          <div class="shade" aria-hidden="true"></div>
          <header class="panel-header">
            <div class="panel-date">THU 06 AUG</div>
            <div class="panel-label">MINUTE</div>
          </header>
          <div class="panel-value" id="minute-value">00</div>
          <footer class="panel-footer"><time class="mini-clock">00:00:00</time></footer>
        </section>

        <section class="panel" data-kind="second">
          <video id="second-video" class="panel-video" muted autoplay loop playsinline preload="auto"></video>
          <div class="shade" aria-hidden="true"></div>
          <header class="panel-header">
            <div class="panel-date">THU 06 AUG</div>
            <div class="panel-label">SECOND</div>
          </header>
          <div class="panel-value" id="second-value">00</div>
          <footer class="panel-footer"><time class="mini-clock">00:00:00</time></footer>
        </section>
      </main>
    </div>
  </div>
  <aside id="debug" hidden></aside>
  <script src="app.js?v=20260806-1"></script>
</body>
</html>
