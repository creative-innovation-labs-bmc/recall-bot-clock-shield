name: Build local font and video assets
on:
  push:
    branches: [main]
    paths:
      - tools/build_assets.py
      - tools/qc.py
      - .github/workflows/build-assets.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-assets
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-open-sans fonts-paratype
          python3 -m pip install --disable-pip-version-check fonttools brotli
      - name: Generate local assets
        run: |
          python3 tools/build_assets.py
          python3 tools/qc.py
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screen-b7f4e2/assets screen-b7f4e2/fonts screen-b7f4e2/licenses
          if git diff --cached --quiet; then
            echo "Assets already current"
          else
            git commit -m "Build local font and placeholder video assets"
            git push
          fi
